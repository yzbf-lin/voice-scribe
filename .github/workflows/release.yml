name: Release

# Build installers on native runners and attach them to a GitHub Release.
#
# Cross-compiling from one laptop cannot produce a trustworthy Windows build: the
# native whisper binding and ffmpeg are platform binaries that npm only installs
# for the host. Each job below therefore runs on the OS it targets, and the
# publish job collects everything into a single release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both mac architectures build on one Apple Silicon runner.
          # macos-13 (the only Intel image) queues for tens of minutes or not at
          # all now that GitHub is retiring it, so cross-building x64 from arm64
          # is the reliable path: scripts/prepare-platform-deps.js fetches the
          # x64 ffmpeg and whisper binding, after-pack swaps them in.
          - os: macos-14
            label: macOS (arm64 + x64)
            platform: mac
            arch: ""
            artifact: mac
          - os: windows-latest
            label: Windows x64
            platform: win
            arch: x64
            artifact: win-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs the optional dependency for this runner's OS/arch only,
      # which is exactly what we want: the native whisper binding and ffmpeg
      # match the target by construction.
      - name: Install dependencies
        run: npm ci

      # Only needed for cross-built targets (macOS x64 on an arm64 runner).
      - name: Fetch cross-target native deps
        if: matrix.platform == 'mac'
        run: node scripts/prepare-platform-deps.js darwin-arm64 darwin-x64

      - name: Build renderer
        run: npm run build

      # Unsigned builds: no Developer ID certificate is available, and Windows
      # installers are unsigned by design. macOS artifacts are ad-hoc signed by
      # electron-builder, so users must clear the quarantine flag once (documented
      # in the release notes).
      #
      # Split into two steps rather than interpolating an optional --arch flag:
      # for macOS the arch is deliberately empty so electron-builder's own target
      # list (arm64 + x64) decides what gets built.
      - name: Package (macOS, both arches)
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package (Windows x64)
        if: matrix.platform == 'win'
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List artifacts
        shell: bash
        run: ls -lh release/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show collected files
        run: ls -lh artifacts/

      # Fail loudly if a platform produced nothing, rather than publishing a
      # release that silently only covers one OS.
      - name: Check artifacts
        run: |
          test -n "$(ls artifacts/*.dmg 2>/dev/null)" || { echo "no macOS dmg"; exit 1; }
          test -n "$(ls artifacts/*.exe 2>/dev/null)" || { echo "no Windows installer"; exit 1; }
          echo "ok"

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          generate_release_notes: true
          body: |
            ## VoiceScribe 0.1.0

            本地离线的音视频转文字工具，基于 whisper.cpp，无需 Python、无需联网转写。

            ### 下载
            | 平台 | 文件 |
            | --- | --- |
            | macOS (Apple Silicon) | `VoiceScribe-0.1.0-arm64.dmg` |
            | macOS (Intel) | `VoiceScribe-0.1.0.dmg` |
            | Windows x64 | `VoiceScribe Setup 0.1.0.exe` |

            `*.zip` 是同一份 App 的压缩包，免安装，解压即用。

            ### 首次打开（未签名构建）
            这些安装包没有代码签名证书，系统会提示"无法验证开发者"。

            **macOS**：把 App 拖进"应用程序"后执行一次
            ```bash
            xattr -dr com.apple.quarantine /Applications/VoiceScribe.app
            ```

            **Windows**：SmartScreen 提示时点"更多信息"→"仍要运行"。

            ### 首次使用
            应用内会自动下载 Whisper 模型（`small` 约 465 MB，`large-v3` 约 2.9 GB），
            支持暂停和断点续传，下载完成后即可完全离线使用。
